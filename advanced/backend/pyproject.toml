[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cinetrack-advanced-backend"
version = "2.0.0"
description = "Advanced CineTrack TMDB-backed mobile-project backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.12,<1",
  "email-validator>=2.2,<3",
  "redis>=5.2,<7",
  "httpx>=0.27,<1",
  "Pillow>=11,<13"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
