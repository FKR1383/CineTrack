user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 6m;

    log_format main '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    upstream timetv_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name 31.57.118.82 _;
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name 31.57.118.82 _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        limit_conn conn_per_ip 30;

        location = /health {
            proxy_pass http://timetv_backend/health;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /ready {
            proxy_pass http://timetv_backend/ready;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=30 nodelay;
            proxy_pass http://timetv_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /uploads/ {
            proxy_pass http://timetv_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location = /openapi.json { proxy_pass http://timetv_backend/openapi.json; }
        location /docs { proxy_pass http://timetv_backend/docs; }
        location /redoc { proxy_pass http://timetv_backend/redoc; }

        location / {
            default_type text/plain;
            return 200 'TimeTV Advanced API\n';
        }
    }
}
