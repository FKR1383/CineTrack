name: cinetrack_advanced
description: Advanced CineTrack movie and series tracking mobile application.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  local_auth: ^2.3.0
  app_links: 6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
